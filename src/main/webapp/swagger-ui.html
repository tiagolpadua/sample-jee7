<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample JEE7 API - Swagger UI</title>
    <link rel="stylesheet" href="webjars/swagger-ui/4.15.5/swagger-ui.css">
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="webjars/swagger-ui/4.15.5/swagger-ui-bundle.js"></script>
    <script>
        window.onload = function() {
            SwaggerUIBundle({
                url: "/sample-jee7/api/swagger.json",
                dom_id: '#swagger-ui',
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                ],
                layout: "BaseLayout"
            });
        };
    </script>
</body>
</html>
